# On every push to dev (the release branch): mirror every published package as a release asset of this repo, build
# index.json with the mirror links and upload it to the fixed release `index` (replacing the old file). Then the
# website deploy hook (secret WEBSITE_DEPLOY_HOOK) is called; the website build copies the file and serves it at
# https://blockheads.club/mods/index.json. The index is not signed: integrity is the sha256 and size of every
# package version, checked by CI, the game, the Patcher and the server. Draft entries are never published.
name: Publish

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

env:
  MOD_SDK_REPO: https://github.com/Blockheads-Club/mod-sdk
  MOD_SDK_REF: dev
  MAX_PACKAGE_BYTES: "33554432"

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install bhmod
        run: cargo install --locked --git "$MOD_SDK_REPO" --branch "$MOD_SDK_REF" bhmod --root "$RUNNER_TEMP/bhmod"
      - name: Mirror packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/bhmod/bin/bhmod" index build --repo . -o "$RUNNER_TEMP/all.json"
          jq -r '.mods[] | .id as $id | .versions[] | [$id, .version, .url, .sha256] | @tsv' "$RUNNER_TEMP/all.json" |
          while IFS=$'\t' read -r id version url sha; do
            tag="$id-$version"
            if gh release view "$tag" > /dev/null 2>&1; then continue; fi
            file="$RUNNER_TEMP/$tag.bhmod"
            curl -sSfL --proto '=https' --max-redirs 5 --max-filesize "$MAX_PACKAGE_BYTES" --max-time 120 "$url" -o "$file"
            echo "$sha  $file" | sha256sum -c -
            gh release create "$tag" "$file" --target "$GITHUB_SHA" --title "$id $version" \
              --notes "Mirror of $url (sha256 $sha). Kept by the index in case the original link breaks."
          done

  index:
    needs: mirror
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      INDEX_TAG: index
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install bhmod
        run: cargo install --locked --git "$MOD_SDK_REPO" --branch "$MOD_SDK_REF" bhmod --root "$RUNNER_TEMP/bhmod"
      - name: Build index.json
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/bhmod/bin/bhmod" index build --repo . -o "$RUNNER_TEMP/out/index.json" \
            --mirror-base "https://github.com/${{ github.repository }}/releases/download"
          jq -e '.schema == 1 and (.mods | type == "array")' "$RUNNER_TEMP/out/index.json" > /dev/null
      - name: Upload to the index release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$INDEX_TAG" > /dev/null 2>&1; then
            gh release create "$INDEX_TAG" --target "$GITHUB_SHA" --latest=false --title "Mod index" \
              --notes "The current index.json, replaced on every push to dev. Served at https://blockheads.club/mods/index.json."
          fi
          gh release upload "$INDEX_TAG" "$RUNNER_TEMP/out/index.json" --clobber
          echo "Uploaded https://github.com/${{ github.repository }}/releases/download/$INDEX_TAG/index.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild the website
        env:
          WEBSITE_DEPLOY_HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$WEBSITE_DEPLOY_HOOK" ]; then
            echo "::notice::WEBSITE_DEPLOY_HOOK is not set; blockheads.club/mods updates on the next website deploy."
            exit 0
          fi
          curl -sSf -X POST --max-time 60 "$WEBSITE_DEPLOY_HOOK" -o /dev/null
          echo "Website rebuild requested."
